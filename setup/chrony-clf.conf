# /etc/chrony/conf.d/clf.conf  (or append to /etc/chrony/chrony.conf)
#
# Host clock disciplined by the GPS PPS:
# - GPS (from gpsd, shared memory 0): coarse time, only tells which second it is.
#   offset = typical delay of the NMEA sentences; it only has to be within +-0.5 s.
# - PPS (/dev/pps0): the edge of the second, locked to the second given by GPS.
refclock SHM 0 refid GPS precision 1e-1 offset 0.2 delay 0.2 noselect
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7

# step the clock at start if it is far off, then only slew
makestep 1 3

# On an isolated network comment out the 'pool' / 'server' lines of chrony.conf.
